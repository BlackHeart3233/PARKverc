<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Unity Web Player | simulacija_test1</title>
<link rel="shortcut icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">
<style>
  #controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px;
    gap: 10px;
    z-index: 100;
  }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }

  #controls button {
    width: 60px;
    height: 60px;
    font-size: 18px;
    border-radius: 8px;
  }

  #brake-button {
    position: absolute;
    bottom: 20px;
    left: 20px;
    padding: 15px 25px;
    font-size: 18px;
    background-color: red;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0.8;
  }
  #brake-button:active { opacity: 1; }

  #video-frame {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 960px;     
  height: 544px;    
  background: black;
  z-index: 10;
}

#video-frame img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#fade-overlay {
  position: fixed;
  inset: 0;
  background: black;
  z-index: 9999;
  opacity: 1;
  pointer-events: none;
  transition: opacity 1s ease-in-out;
}

#fade-overlay.fade-out {
  opacity: 0;
}


</style>
</head>
<body>
<div id="fade-overlay"></div>
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas" width="1920" height="1080"></canvas>
<div id="video-frame"></div>
  
<div id="unity-loading-bar">
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>
</div>


<div id="controls">
  <button id="up">↑</button>
  <button id="left">←</button>
  <button id="down">↓</button>
  <button id="right">→</button>
</div>

<script>
var realTestJson = null;
var canvas = document.querySelector("#unity-canvas");
var unityInstance;

function unityShowBanner(msg, type) {
  var warningBanner = document.querySelector("#unity-warning");
  function updateBannerVisibility() {
    warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
  }
  var div = document.createElement('div');
  div.innerHTML = msg;
  warningBanner.appendChild(div);
  if (type == 'error') div.style = 'background: red; padding: 10px;';
  else if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
  setTimeout(() => { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
  updateBannerVisibility();
}

var buildUrl = "Build";
var loaderUrl = buildUrl + "/web_sim_8.96.loader.js";
var config = {
  arguments: [],
  dataUrl: buildUrl + "/web_sim_8.96.data",
  frameworkUrl: buildUrl + "/web_sim_8.96.framework.js",
  codeUrl: buildUrl + "/web_sim_8.96.wasm",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "DefaultCompany",
  productName: "simulacija_test1",
  productVersion: "0.1.0",
  showBanner: unityShowBanner,
};


  canvas.style.width = "1920px";
  canvas.style.height = "1080px";



var script = document.createElement("script");
script.src = loaderUrl;
script.onload = () => {
  createUnityInstance(canvas, config, (progress) => {
    document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
  }).then((instance) => {
  unityInstance = instance;
  document.querySelector("#unity-loading-bar").style.display = "none";

  let ws = new WebSocket("ws://192.168.89.218:8080");

  ws.onopen = () => {
    console.log("WS CONNECTED");
    ws.send("WEB");
  };

ws.onmessage = (event) => {
    let msg;

    try {
        msg = JSON.parse(event.data);
    } catch (e) {
        console.error("Ni JSON:", event.data);
        return;
    }

        if (msg.json != null) {
        setTimeout(() => {
        console.log("Sending parking lines JSON to Unity");
        unityInstance.SendMessage(
                "ParkingLines",            
                "ReceiveJsonFromJS",
                  JSON.stringify(msg)
              );
            }, 500);
        return;
    }

    if (msg.type === "IMAGE") {
        // OZNAČENA SLIKA
        img.src = "data:image/jpeg;base64," + msg.image;
        return;
    }

    console.log("Neznan message:", msg);
};




  ws.onerror = (e) => console.error("WS ERROR", e);
  ws.onclose = () => console.log("WS CLOSED");


    let horizontal = 0;
    let vertical = 0;
    let parkingValue = 0;
    const parkingSpeed = 0.05;

    function sendInput() {
      if(!unityInstance) return;

      const carJson = JSON.stringify({ x: horizontal, y: vertical, brake: false });
      unityInstance.SendMessage("avtek_test_volan_popravek", "SetInput", carJson);

      if(horizontal < 0) parkingValue = Math.max(parkingValue - parkingSpeed, -1);
      else if(horizontal > 0) parkingValue = Math.min(parkingValue + parkingSpeed, 1);
      else {
        if(parkingValue > 0) parkingValue = Math.max(parkingValue - parkingSpeed, 0);
        else if(parkingValue < 0) parkingValue = Math.min(parkingValue + parkingSpeed, 0);
      }

      const parkingJson = JSON.stringify({ left: parkingValue, right: parkingValue });
      unityInstance.SendMessage("Park assistant", "SetInput", parkingJson);
    }

    ["left","right"].forEach(id => {
      const dir = (id=="left") ? -1 : 1;
      const btn = document.getElementById(id);

      function pressStart() { horizontal = dir; sendInput(); }
      function pressEnd() { horizontal = 0; sendInput(); }

      btn.addEventListener("mousedown", pressStart);
      btn.addEventListener("mouseup", pressEnd);
      btn.addEventListener("mouseout", pressEnd);
      btn.addEventListener("touchstart", pressStart);
      btn.addEventListener("touchend", pressEnd);
    });

    ["up","down"].forEach(id => {
      const dir = (id=="up") ? 1 : -1;
      const btn = document.getElementById(id);

      function pressStart() { vertical = dir; sendInput(); }
      function pressEnd() { vertical = 0; sendInput(); }

      btn.addEventListener("mousedown", pressStart);
      btn.addEventListener("mouseup", pressEnd);
      btn.addEventListener("mouseout", pressEnd);
      btn.addEventListener("touchstart", pressStart);
      btn.addEventListener("touchend", pressEnd);
    });

  

    setInterval(sendInput, 50);

  }).catch((message) => { alert(message); });
};
document.body.appendChild(script);


const frameDiv = document.getElementById("video-frame");
const img = document.createElement("img");
frameDiv.appendChild(img);


window.addEventListener("load", () => {
  const overlay = document.getElementById("fade-overlay");

  setTimeout(() => {
    overlay.classList.add("fade-out");

    setTimeout(() => {
      overlay.remove();
    }, 1000);

  }, 1000);
});

</script>

</body>
</html>
