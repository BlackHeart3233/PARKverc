<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>Unity Web Player | simulacija_test1</title>
<link rel="shortcut icon" href="TemplateData/favicon.ico">
<link rel="stylesheet" href="TemplateData/style.css">
<style>
  #controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px;
    gap: 10px;
    z-index: 100;
  }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }

  #controls button {
    width: 60px;
    height: 60px;
    font-size: 18px;
    border-radius: 8px;
  }

  #brake-button {
    position: absolute;
    bottom: 20px;
    left: 20px;
    padding: 15px 25px;
    font-size: 18px;
    background-color: red;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0.8;
  }
  #brake-button:active { opacity: 1; }
</style>
</head>
<body>
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas" width="1920" height="1080"></canvas>
  <div id="unity-loading-bar">
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>
</div>

<button id="brake-button">Brake</button>

<div id="controls">
  <button id="up">↑</button>
  <button id="left">←</button>
  <button id="down">↓</button>
  <button id="right">→</button>
</div>

<script>
var canvas = document.querySelector("#unity-canvas");
var unityInstance;

function unityShowBanner(msg, type) {
  var warningBanner = document.querySelector("#unity-warning");
  function updateBannerVisibility() {
    warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
  }
  var div = document.createElement('div');
  div.innerHTML = msg;
  warningBanner.appendChild(div);
  if (type == 'error') div.style = 'background: red; padding: 10px;';
  else if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
  setTimeout(() => { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
  updateBannerVisibility();
}

var loaderUrl = buildUrl + "/web_sim_8.94.loader.js";

  streamingAssetsUrl: "StreamingAssets",
  companyName: "DefaultCompany",
  productName: "simulacija_test1",
  productVersion: "0.1.0",
  showBanner: unityShowBanner,
};

    let horizontal = 0;
    let vertical = 0;
    let parkingValue = 0;
    const parkingSpeed = 0.05;

    function sendInput() {
      if(!unityInstance) return;

      const carJson = JSON.stringify({ x: horizontal, y: vertical, brake: false });
      unityInstance.SendMessage("avtek_test_volan_popravek", "SetInput", carJson);

      if(horizontal < 0) parkingValue = Math.max(parkingValue - parkingSpeed, -1);
      else if(horizontal > 0) parkingValue = Math.min(parkingValue + parkingSpeed, 1);
      else {
        if(parkingValue > 0) parkingValue = Math.max(parkingValue - parkingSpeed, 0);
        else if(parkingValue < 0) parkingValue = Math.min(parkingValue + parkingSpeed, 0);
      }

      const parkingJson = JSON.stringify({ left: parkingValue, right: parkingValue });
      unityInstance.SendMessage("Park assistant", "SetInput", parkingJson);
    }

    ["left","right"].forEach(id => {
      const dir = (id=="left") ? -1 : 1;
      const btn = document.getElementById(id);

      function pressStart() { horizontal = dir; sendInput(); }
      function pressEnd() { horizontal = 0; sendInput(); }

      btn.addEventListener("mousedown", pressStart);
      btn.addEventListener("mouseup", pressEnd);
      btn.addEventListener("mouseout", pressEnd);
      btn.addEventListener("touchstart", pressStart);
      btn.addEventListener("touchend", pressEnd);
    });

    ["up","down"].forEach(id => {
      const dir = (id=="up") ? 1 : -1;
      const btn = document.getElementById(id);

      function pressStart() { vertical = dir; sendInput(); }
      function pressEnd() { vertical = 0; sendInput(); }

      btn.addEventListener("mousedown", pressStart);
      btn.addEventListener("mouseup", pressEnd);
      btn.addEventListener("mouseout", pressEnd);
      btn.addEventListener("touchstart", pressStart);
      btn.addEventListener("touchend", pressEnd);
    });

    const brakeBtn = document.getElementById('brake-button');
    function sendBrake(isPressed) {
      if(!unityInstance) return;
      const json = JSON.stringify({ x: 0, y: 0, brake: isPressed });
      unityInstance.SendMessage('avtek_test_volan_popravek', 'SetInput', json);
    }
    brakeBtn.addEventListener('mousedown', () => sendBrake(true));
    brakeBtn.addEventListener('mouseup', () => sendBrake(false));
    brakeBtn.addEventListener('touchstart', () => sendBrake(true));
    brakeBtn.addEventListener('touchend', () => sendBrake(false));

    setInterval(sendInput, 50);

  }).catch((message) => { alert(message); });
