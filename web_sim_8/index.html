<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | simulacija_test1</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Preprosti gumbi za premike */
      #controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        grid-template-columns: 60px 60px 60px;
        grid-template-rows: 60px 60px;
        gap: 10px;
        z-index: 100;
      }
      #controls button {
        width: 60px;
        height: 60px;
        font-size: 18px;
        border-radius: 8px;
      }
      #up { grid-column: 2; grid-row: 1; }
      #left { grid-column: 1; grid-row: 2; }
      #down { grid-column: 2; grid-row: 2; }
      #right { grid-column: 3; grid-row: 2; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">simulacija_test1</div>
      </div>
    </div>

    <!-- Gumbi za premikanje -->
    <div id="controls">
      <button id="up">↑</button>
      <button id="left">←</button>
      <button id="down">↓</button>
      <button id="right">→</button>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
        setTimeout(() => { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/web_sim_8.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/web_sim_8.data",
        frameworkUrl: buildUrl + "/web_sim_8.framework.js",
        codeUrl: buildUrl + "/web_sim_8.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "simulacija_test1",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };

          // --- Pošiljanje inputa Unity-ju ---
          let horizontal = 0;
          let vertical = 0;

          function sendInput() {
            unityInstance.SendMessage("avtek_test_volan_popravek", "SetInput", JSON.stringify({x: horizontal, y: vertical}));
          }

          document.getElementById("up").addEventListener("mousedown", () => { vertical = 1; sendInput(); });
          document.getElementById("down").addEventListener("mousedown", () => { vertical = -1; sendInput(); });
          document.getElementById("left").addEventListener("mousedown", () => { horizontal = -1; sendInput(); });
          document.getElementById("right").addEventListener("mousedown", () => { horizontal = 1; sendInput(); });

          // Ko spustimo gumb, input resetiramo
          ["up","down"].forEach(id => document.getElementById(id).addEventListener("mouseup", () => { vertical = 0; sendInput(); }));
          ["left","right"].forEach(id => document.getElementById(id).addEventListener("mouseup", () => { horizontal = 0; sendInput(); }));

          // Podpora tudi za mouseout (če cursor zapusti gumb)
          ["up","down"].forEach(id => document.getElementById(id).addEventListener("mouseout", () => { vertical = 0; sendInput(); }));
          ["left","right"].forEach(id => document.getElementById(id).addEventListener("mouseout", () => { horizontal = 0; sendInput(); }));

        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
