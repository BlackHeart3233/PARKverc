<style>
  #controls {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px;
    gap: 10px;
    z-index: 100;
  }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }

  #controls button {
    width: 60px;
    height: 60px;
    font-size: 18px;
    border-radius: 8px;
  }

  #brake-button {
    position: absolute;
    bottom: 20px;
    left: 20px;
    padding: 15px 25px;
    font-size: 18px;
    background-color: red;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0.8;
  }
  #brake-button:active { opacity: 1; }

  #video-frame {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 960px;     
  height: 544px;    
  background: black;
  z-index: 10;
}

#video-frame img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#fade-overlay {
  position: fixed;
  inset: 0;
  background: black;
  z-index: 9999;
  opacity: 1;
  pointer-events: none;
  transition: opacity 1s ease-in-out;
}

#fade-overlay.fade-out {
  opacity: 0;
}

#distance-frame {
  position: fixed;
  inset: 0;
  border: 12px solid transparent;
  pointer-events: none;
  z-index: 10000;
  box-sizing: border-box;
  transition: border-color 0.2s ease;
}

#warning-icon {
  position: fixed;
  top: 47%;
  left: 35px;         
  transform: translateY(-50%);
  font-size: 120px;
  color: red;
  display: none;
  z-index: 10001;
  animation: pulse 1s infinite;
}


@keyframes pulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.15); opacity: 0.7; }
  100% { transform: scale(1); opacity: 1; }
}

  var warningBanner = document.querySelector("#unity-warning");
  function updateBannerVisibility() {
    warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
  }
  var div = document.createElement('div');
  div.innerHTML = msg;
  warningBanner.appendChild(div);
  if (type == 'error') div.style = 'background: red; padding: 10px;';
  else if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
  setTimeout(() => { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);

}

function updateDistanceFrame(dist) {
  warningIcon.style.display = "none";

  if (dist <= 10) {
    frame.style.borderColor = "red";
    warningIcon.style.display = "block";
  }
  else if (dist <= 20) {
    frame.style.borderColor = "red";
  }
  else if (dist <= 30) {
    frame.style.borderColor = "orange";
  }
  else if (dist <= 40) {
    frame.style.borderColor = "yellow";
  }
  else {
    frame.style.borderColor = "limegreen";
  }
}



function offsetToSteerCommand(offset) {
  const abs = Math.abs(offset);

  if (abs < 5) return null; 

  const duration = Math.min(3, (abs / 540) * 3); 
  const direction = offset > 0 ? "right" : "left";

  return { direction, duration };
}

ws.onmessage = (event) => {
    let msg;

    try {
        msg = JSON.parse(event.data);
    } catch (e) {
        console.error("Ni JSON:", event.data);
        return;
    }

            );

        if(msg.rotation !== undefined && assistedMode) {
            const angle = msg.rotation;
            handleNewOffset(angle);
            console.log("assistedMode:", Rotary);

function simulateSteer(direction, durationSeconds) {
  if (steerTimeout) return;

  horizontal = direction === "right" ? 1 : -1;

  console.log(
    "STEER",
    direction,
    "for",
    durationSeconds.toFixed(2),
    "s"
  );

  steerTimeout = setTimeout(() => {
    horizontal = 0;
    steerTimeout = null;
  }, durationSeconds * 1000);
}


function offsetToSignedTime(offset) {
  return (offset / 540) * 3; 
}



function handleNewOffset(newOffset) {
  if (steerTimeout) return;

  const prevTime = offsetToSignedTime(lastOffset);
  const newTime  = offsetToSignedTime(newOffset);

  const deltaTime = newTime - prevTime;

  if (Math.abs(deltaTime) < 0.05) return;

  const direction = deltaTime > 0 ? "right" : "left";
  simulateSteer(direction, Math.abs(deltaTime));

  lastOffset = newOffset;
}

function sendInput() {
      if(!unityInstance) return;

      const carJson = JSON.stringify({ x: horizontal, y: vertical, brake: false });
      unityInstance.SendMessage("avtek_test_volan_popravek", "SetInput", carJson);

      if(horizontal < 0) parkingValue = Math.max(parkingValue - parkingSpeed, -1);
      else if(horizontal > 0) parkingValue = Math.min(parkingValue + parkingSpeed, 1);
      else {
        if(parkingValue > 0) parkingValue = Math.max(parkingValue - parkingSpeed, 0);
        else if(parkingValue < 0) parkingValue = Math.min(parkingValue + parkingSpeed, 0);
      }

      const parkingJson = JSON.stringify({ left: parkingValue, right: parkingValue });
      unityInstance.SendMessage("Park assistant", "SetInput", parkingJson);
    }

    ["left","right"].forEach(id => {
      const dir = (id=="left") ? -1 : 1;
      const btn = document.getElementById(id);

      function pressStart() { horizontal = dir; sendInput(); }
      function pressEnd() { horizontal = 0; sendInput(); }

      btn.addEventListener("mousedown", pressStart);
      btn.addEventListener("mouseup", pressEnd);
      btn.addEventListener("mouseout", pressEnd);
      btn.addEventListener("touchstart", pressStart);
      btn.addEventListener("touchend", pressEnd);
    });

  

  

    setInterval(sendInput, 50);

  }).catch((message) => { alert(message); });
};
